<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">One process, three access questions</title><desc id="d">Sales array uses position, stock dictionary uses product code, service queue uses arrival order.</desc><rect width="100%" height="100%" rx="12" fill="#f5f7fb"/><text x="30" y="40" font-family="sans-serif" font-size="26" fill="#24334a">Choose by the question the program must answer</text><rect x="30" y="75" width="285" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="45" y="105" font-family="sans-serif" font-size="22" fill="#24334a">Position: Tuesday?</text><rect x="355" y="75" width="285" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="370" y="105" font-family="sans-serif" font-size="22" fill="#24334a">Key: PEN?</text><rect x="680" y="75" width="285" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="695" y="105" font-family="sans-serif" font-size="22" fill="#24334a">Next: who arrived first?</text><text x="40" y="160" font-family="sans-serif" font-size="22" fill="#24334a">Array / list</text><text x="365" y="160" font-family="sans-serif" font-size="22" fill="#24334a">Dictionary</text><text x="690" y="160" font-family="sans-serif" font-size="22" fill="#24334a">Queue</text><text x="40" y="210" font-family="sans-serif" font-size="22" fill="#24334a">dailySales[1]</text><text x="365" y="210" font-family="sans-serif" font-size="22" fill="#24334a">stock["PEN"]</text><text x="690" y="210" font-family="sans-serif" font-size="22" fill="#24334a">requests.Dequeue()</text><text x="40" y="290" font-family="sans-serif" font-size="22" fill="#24334a">One application can use all three. The stored type alone does not choose the collection.</text></svg>