<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">One process, three access questions</title><desc id="d">Sales array uses position, stock dictionary uses product code, service queue uses arrival order.</desc><style>
.is-interactive [data-choice] { cursor: pointer; }
.is-interactive [data-choice]:hover rect, .is-interactive [data-choice]:focus rect { fill: #e8f0fa; }
.is-interactive [data-choice]:focus { outline: none; }
.is-interactive [data-choice]:focus-visible rect { stroke-width: 4; }
.is-interactive [data-choice].is-chosen rect { fill: #1765a8; }
.is-interactive [data-choice].is-chosen text { fill: #ffffff; }
.is-interactive [data-answer]:not(.is-shown) { display: none; }
[data-placeholder] { display: none; }
.is-interactive [data-placeholder]:not(.is-hidden) { display: inline; }
[data-hint] { display: none; }
.is-interactive:not(.all-shown) [data-hint] { display: inline; }
</style><rect width="100%" height="100%" rx="12" fill="#f5f7fb"/><text x="30" y="40" font-family="sans-serif" font-size="26" fill="#24334a">Choose by the question the program must answer</text>
<g data-choice="position"><rect x="30" y="75" width="285" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="45" y="105" font-family="sans-serif" font-size="22" fill="#24334a">Position: Tuesday?</text></g>
<g data-choice="key"><rect x="355" y="75" width="285" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="370" y="105" font-family="sans-serif" font-size="22" fill="#24334a">Key: PEN?</text></g>
<g data-choice="next"><rect x="680" y="75" width="285" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="695" y="105" font-family="sans-serif" font-size="22" fill="#24334a">Next: who arrived first?</text></g>
<g data-answer="position"><text x="40" y="160" font-family="sans-serif" font-size="22" fill="#24334a">Array / list</text><text x="40" y="210" font-family="sans-serif" font-size="22" fill="#24334a">dailySales[1]</text></g>
<g data-answer="key"><text x="365" y="160" font-family="sans-serif" font-size="22" fill="#24334a">Dictionary</text><text x="365" y="210" font-family="sans-serif" font-size="22" fill="#24334a">stock["PEN"]</text></g>
<g data-answer="next"><text x="690" y="160" font-family="sans-serif" font-size="22" fill="#24334a">Queue</text><text x="690" y="210" font-family="sans-serif" font-size="22" fill="#24334a">requests.Dequeue()</text></g>
<g data-placeholder="position"><rect x="30" y="140" width="285" height="90" rx="6" fill="none" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="8 6"/><text x="160" y="195" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#9fb3c8">?</text></g>
<g data-placeholder="key"><rect x="355" y="140" width="285" height="90" rx="6" fill="none" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="8 6"/><text x="497" y="195" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#9fb3c8">?</text></g>
<g data-placeholder="next"><rect x="680" y="140" width="285" height="90" rx="6" fill="none" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="8 6"/><text x="822" y="195" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#9fb3c8">?</text></g>
<text data-hint="true" x="40" y="255" font-family="sans-serif" font-size="19" fill="#5b6b7f">Predict the collection for each question, then click the question to check.</text>
<text x="40" y="300" font-family="sans-serif" font-size="22" fill="#24334a">One application can use all three. The stored type alone does not choose the collection.</text></svg>
