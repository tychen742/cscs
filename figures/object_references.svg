<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="title desc"><title id="title">References and composition</title><desc id="desc">Two variables refer to one customer object. Separately, an order owns a private collection of order lines, and each line refers to a product.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#334155"/></marker></defs><g fill="#eff6ff" stroke="#334155" stroke-width="2"><rect x="20" y="25" width="130" height="45" rx="6"/><rect x="20" y="130" width="130" height="45" rx="6"/><rect x="225" y="75" width="160" height="65" rx="6"/><rect x="445" y="20" width="250" height="50" rx="6"/><rect x="445" y="105" width="250" height="50" rx="6"/><rect x="445" y="190" width="250" height="35" rx="6"/></g><g font-family="sans-serif" font-size="17" fill="#0f172a" text-anchor="middle"><text x="85" y="54">customer</text><text x="85" y="159">alias</text><text x="305" y="102">Customer object</text><text x="305" y="126">Name: North</text><text x="570" y="51">Order</text><text x="570" y="136">Private order lines</text><text x="570" y="214">Product references</text></g><g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M150 48 L225 90"/><path d="M150 153 L225 125"/><path d="M570 70 L570 104"/><path d="M570 155 L570 189"/></g></svg>