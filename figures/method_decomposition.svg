<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Name the repeated task</title><desc id="d">Before: repeated receipt-header statements. After: two calls reuse one PrintHeader definition.</desc><rect width="100%" height="100%" rx="12" fill="#f5f7fb"/><text x="30" y="40" font-family="sans-serif" font-size="27" fill="#24334a">A method gives repeated work one name</text><rect x="35" y="80" width="420" height="50" rx="7" fill="white" stroke="#1765a8" stroke-width="2"/><text x="49" y="112" font-family="sans-serif" font-size="21" fill="#24334a">Before: copy the header statements</text><rect x="545" y="80" width="420" height="50" rx="7" fill="white" stroke="#1765a8" stroke-width="2"/><text x="559" y="112" font-family="sans-serif" font-size="21" fill="#24334a">After: call PrintHeader()</text><text x="60" y="180" font-family="sans-serif" font-size="21" fill="#24334a">Print store name; print separator.</text><text x="60" y="230" font-family="sans-serif" font-size="21" fill="#24334a">Print store name; print separator.</text><text x="570" y="180" font-family="sans-serif" font-size="21" fill="#24334a">PrintHeader();   PrintHeader();</text><text x="570" y="230" font-family="sans-serif" font-size="21" fill="#24334a">One definition → reused behavior</text><text x="35" y="310" font-family="sans-serif" font-size="21" fill="#24334a">Changing the definition changes every future call; callers retain the task name.</text></svg>