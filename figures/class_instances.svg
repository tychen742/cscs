<svg xmlns="http://www.w3.org/2000/svg" width="584" height="228" viewBox="0 0 584 228" role="img" aria-labelledby="title desc">
<title id="title">One class, multiple objects</title>
<desc id="desc">The Account class defines Owner and Balance fields and a Deposit method that accepts a decimal amount and returns the updated balance. Two new Account() calls create separate objects, also called instances. Avery has a balance of 2500; Jordan has a balance of 1000. Each object holds its own field values, assigned after construction.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#386a87"/></marker></defs>
<style>.heading{font:600 15px system-ui,sans-serif;fill:#24334a}.code{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#24334a}.note{font:11px system-ui,sans-serif;fill:#425466}.arrow{fill:none;stroke:#386a87;stroke-width:1.5;marker-end:url(#arrow)}</style>
<rect x="14" y="62" width="232" height="104" rx="5" fill="#f4f7fa" stroke="#386a87"/>
<text class="heading" x="28" y="86">Class: Account</text>
<text class="note" x="28" y="104">Defines the shared structure:</text>
<text class="code" x="28" y="122">string Owner</text>
<text class="code" x="28" y="138">decimal Balance</text>
<text class="code" x="28" y="154">decimal Deposit(decimal amount)</text>
<path class="arrow" d="M246 102 C302 102 302 58 390 58"/>
<path class="arrow" d="M246 143 C302 143 302 172 390 172"/>
<text class="code" x="255" y="43">new Account()</text>
<text class="code" x="255" y="200">new Account()</text>
<rect x="400" y="14" width="164" height="76" rx="5" fill="#fff" stroke="#386a87"/>
<text class="heading" x="414" y="38">Object / instance 1</text>
<text class="code" x="414" y="58">Owner = "Avery Chen"</text>
<text class="code" x="414" y="74">Balance = 2500m</text>
<rect x="400" y="128" width="164" height="76" rx="5" fill="#fff" stroke="#386a87"/>
<text class="heading" x="414" y="152">Object / instance 2</text>
<text class="code" x="414" y="172">Owner = "Jordan Lee"</text>
<text class="code" x="414" y="188">Balance = 1000m</text>
<text class="note" x="14" y="225">One class definition. Two separate objects, each holding its own field values.</text>
</svg>
