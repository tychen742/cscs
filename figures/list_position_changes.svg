<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">List insertion and removal shift positions</title><desc id="d">Insert CARD at index 1 shifts BOOK and BAG right. RemoveAt 2 removes BOOK; BAG shifts left.</desc><rect width="100%" height="100%" rx="12" fill="#f5f7fb"/><text x="25" y="35" font-family="sans-serif" font-size="26" fill="#24334a">List positions change when items are inserted or removed</text><text x="25" y="95" font-family="sans-serif" font-size="20" fill="#24334a">Before</text><rect x="275" y="65" width="145" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="290" y="95" font-family="sans-serif" font-size="22" fill="#24334a">0: PEN</text><rect x="440" y="65" width="145" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="455" y="95" font-family="sans-serif" font-size="22" fill="#24334a">1: BOOK</text><rect x="605" y="65" width="145" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="620" y="95" font-family="sans-serif" font-size="22" fill="#24334a">2: BAG</text><text x="25" y="185" font-family="sans-serif" font-size="20" fill="#24334a">Insert(1, "CARD")</text><rect x="275" y="155" width="145" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="290" y="185" font-family="sans-serif" font-size="22" fill="#24334a">0: PEN</text><rect x="440" y="155" width="145" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="455" y="185" font-family="sans-serif" font-size="22" fill="#24334a">1: CARD</text><rect x="605" y="155" width="145" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="620" y="185" font-family="sans-serif" font-size="22" fill="#24334a">2: BOOK</text><rect x="770" y="155" width="145" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="785" y="185" font-family="sans-serif" font-size="22" fill="#24334a">3: BAG</text><text x="25" y="275" font-family="sans-serif" font-size="20" fill="#24334a">RemoveAt(2)</text><rect x="275" y="245" width="145" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="290" y="275" font-family="sans-serif" font-size="22" fill="#24334a">0: PEN</text><rect x="440" y="245" width="145" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="455" y="275" font-family="sans-serif" font-size="22" fill="#24334a">1: CARD</text><rect x="605" y="245" width="145" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="620" y="275" font-family="sans-serif" font-size="22" fill="#24334a">2: BAG</text></svg>