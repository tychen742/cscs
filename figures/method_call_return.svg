<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">A call produces a value in its caller</title><desc id="d">The caller passes 4 to SquareTheNumber; num is 4, result 16 returns to squaredNum.</desc><rect width="100%" height="100%" rx="12" fill="#f5f7fb"/><text x="30" y="40" font-family="sans-serif" font-size="26" fill="#24334a">Follow the call in, then return to the waiting expression</text><rect x="35" y="85" width="420" height="50" rx="7" fill="white" stroke="#1765a8" stroke-width="2"/><text x="49" y="117" font-family="sans-serif" font-size="21" fill="#24334a">SquareTheNumber(digit)</text><rect x="555" y="85" width="405" height="50" rx="7" fill="white" stroke="#1765a8" stroke-width="2"/><text x="569" y="117" font-family="sans-serif" font-size="21" fill="#24334a">num receives 4</text><text x="475" y="116" font-family="sans-serif" font-size="28" fill="#24334a">→</text><text x="590" y="185" font-family="sans-serif" font-size="21" fill="#24334a">return num * num;</text><text x="470" y="235" font-family="sans-serif" font-size="25" fill="#24334a">← 16</text><text x="45" y="235" font-family="sans-serif" font-size="21" fill="#24334a">squaredNum receives 16</text><text x="45" y="310" font-family="sans-serif" font-size="21" fill="#24334a">A call is not a jump to the next definition. It returns to its own caller.</text></svg>