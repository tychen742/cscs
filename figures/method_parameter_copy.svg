<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Caller and parameter are separate variables</title><desc id="d">Caller quantity is 4. Increase receives a copied value in count, changes count to 5, and returns 5 without changing quantity.</desc><rect width="100%" height="100%" rx="12" fill="#f5f7fb"/><text x="30" y="40" font-family="sans-serif" font-size="26" fill="#24334a">Copying a value does not rename or share the caller variable</text><rect x="40" y="85" width="300" height="50" rx="7" fill="white" stroke="#1765a8" stroke-width="2"/><text x="54" y="117" font-family="sans-serif" font-size="21" fill="#24334a">caller: quantity = 4</text><text x="385" y="115" font-family="sans-serif" font-size="24" fill="#24334a">copy 4 →</text><rect x="580" y="85" width="360" height="50" rx="7" fill="white" stroke="#1765a8" stroke-width="2"/><text x="594" y="117" font-family="sans-serif" font-size="21" fill="#24334a">parameter: count = 4</text><text x="620" y="190" font-family="sans-serif" font-size="21" fill="#24334a">count = count + 1;</text><rect x="580" y="215" width="360" height="50" rx="7" fill="white" stroke="#1765a8" stroke-width="2"/><text x="594" y="247" font-family="sans-serif" font-size="21" fill="#24334a">parameter: count = 5</text><text x="40" y="245" font-family="sans-serif" font-size="21" fill="#24334a">quantity remains 4</text><text x="40" y="315" font-family="sans-serif" font-size="21" fill="#24334a">The returned 5 can be stored separately, or explicitly assigned back to quantity.</text></svg>