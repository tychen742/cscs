<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Trace a returned-string pipeline</title><desc id="d">raw SKU with spaces is trimmed, then uppercased. Each result supplies the next call; raw is unchanged.</desc><rect width="100%" height="100%" rx="12" fill="#f5f7fb"/><text x="30" y="40" font-family="sans-serif" font-size="27" fill="#24334a">Read the chain as a sequence of returned values</text><rect x="25" y="95" width="280" height="50" rx="7" fill="white" stroke="#1765a8" stroke-width="2"/><text x="39" y="127" font-family="sans-serif" font-size="21" fill="#24334a">"  elec-1042-blk "</text><text x="330" y="127" font-family="sans-serif" font-size="23" fill="#24334a">Trim() →</text><rect x="460" y="95" width="250" height="50" rx="7" fill="white" stroke="#1765a8" stroke-width="2"/><text x="474" y="127" font-family="sans-serif" font-size="21" fill="#24334a">"elec-1042-blk"</text><text x="735" y="127" font-family="sans-serif" font-size="18" fill="#24334a">ToUpperInvariant()</text><text x="330" y="220" font-family="sans-serif" font-size="21" fill="#24334a">→</text><rect x="460" y="190" width="350" height="50" rx="7" fill="white" stroke="#1765a8" stroke-width="2"/><text x="474" y="222" font-family="sans-serif" font-size="21" fill="#24334a">"ELEC-1042-BLK"</text><text x="35" y="305" font-family="sans-serif" font-size="21" fill="#24334a">raw is unchanged. Assign the final returned value to keep the normalized code.</text></svg>