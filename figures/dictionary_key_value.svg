<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">A dictionary associates keys with values</title><desc id="d">Product code PEN maps to quantity 12, BOOK maps to 5. Updating PEN to 15 keeps two entries.</desc><rect width="100%" height="100%" rx="12" fill="#f5f7fb"/><text x="30" y="40" font-family="sans-serif" font-size="26" fill="#24334a">Keys identify entries; positions do not</text><rect x="50" y="85" width="200" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="65" y="115" font-family="sans-serif" font-size="22" fill="#24334a">"PEN"</text><text x="280" y="115" font-family="sans-serif" font-size="22" fill="#24334a">→</text><rect x="340" y="85" width="200" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="355" y="115" font-family="sans-serif" font-size="22" fill="#24334a">12 → 15</text><rect x="50" y="160" width="200" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="65" y="190" font-family="sans-serif" font-size="22" fill="#24334a">"BOOK"</text><text x="280" y="190" font-family="sans-serif" font-size="22" fill="#24334a">→</text><rect x="340" y="160" width="200" height="46" rx="6" fill="white" stroke="#1765a8" stroke-width="2"/><text x="355" y="190" font-family="sans-serif" font-size="22" fill="#24334a">5</text><text x="600" y="115" font-family="sans-serif" font-size="23" fill="#24334a">stock["PEN"] = 15;</text><text x="600" y="165" font-family="sans-serif" font-size="22" fill="#24334a">Updates one value.</text><text x="600" y="210" font-family="sans-serif" font-size="22" fill="#24334a">Count stays 2.</text><text x="50" y="300" font-family="sans-serif" font-size="22" fill="#24334a">New key: adds an entry. Existing key: indexer replaces its value.</text><text x="50" y="335" font-family="sans-serif" font-size="22" fill="#24334a">Add rejects a duplicate key.</text></svg>