services:
  # Browser authoring (load, save, commit notebooks) for Press authors. Accounts live in
  # Press; requests carry Press-signed author passes. Student code never runs here.
  execution-api:
    build:
      context: ..
      dockerfile: execution/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CSCS_ALLOWED_ORIGINS: "https://thinkcscs.org,https://www.thinkcscs.org,http://localhost:3000,http://localhost:8000"
      CSCS_BOOK_ROOT: "/workspace"
      CSCS_BACKUP_ROOT: "/data/notebook-backups"
      # Press pass public keys (not secret); the same keys the runner uses.
      CSCS_RUN_PASS_PUBLIC_KEYS: "${CSCS_RUN_PASS_PUBLIC_KEYS:-}"
      CSCS_AUTHOR_PASS_AUDIENCE: "cscs-authoring"
      CSCS_RUN_PASS_BOOK: "cscs"
    volumes:
      - cscs-data:/data
      - ..:/workspace
      - ${CSCS_SSH_DIR:-/home/tychen/.ssh}:/home/appuser/.ssh:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped

  # The C# runner: the only place student code runs. Internal network only (no
  # internet, database, or host access), no volumes, no secrets in its environment.
  cs-runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    environment:
      CSCS_ALLOWED_ORIGINS: "https://thinkcscs.org,https://www.thinkcscs.org,http://localhost:3000,http://localhost:8000"
      CSCS_MAX_CONCURRENT_EXECUTIONS: "${CSCS_MAX_CONCURRENT_EXECUTIONS:-2}"
      # Guests may hold one of the two slots; the other stays free for signed-in readers.
      CSCS_GUEST_CONCURRENT_EXECUTIONS: "${CSCS_GUEST_CONCURRENT_EXECUTIONS:-1}"
      CSCS_GUEST_RUNS_PER_MINUTE: "${CSCS_GUEST_RUNS_PER_MINUTE:-30}"
      CSCS_SIGNED_IN_RUNS_PER_MINUTE: "${CSCS_SIGNED_IN_RUNS_PER_MINUTE:-30}"
      # Press run-pass public keys (comma-separated PEM bodies; not secret). Empty means
      # every reader is a guest. See press/docs/RUN_PASSES.md.
      CSCS_RUN_PASS_PUBLIC_KEYS: "${CSCS_RUN_PASS_PUBLIC_KEYS:-}"
      CSCS_RUN_PASS_AUDIENCE: "cs-runner"
      CSCS_RUN_PASS_BOOK: "cscs"
    networks:
      - runner
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile: 1024
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  # Carries run requests from the host (Apache) to cs-runner. Runs no student code.
  cs-runner-gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default
      - runner
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      - cs-runner

networks:
  runner:
    internal: true

volumes:
  cscs-data:
