# cs-runner-gateway: carries run requests from the host into cs-runner, which sits on
# an internal-only network and cannot publish a port itself. Runs no student code and
# holds no secrets.
pid /tmp/nginx.pid;
worker_processes 1;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 256k;

    # Docker's embedded DNS; re-resolve so a restarted runner is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        location /v1/tasks/ {
            set $runner http://cs-runner:8080;
            proxy_pass $runner;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Pass Apache's X-Forwarded-For through unchanged; the runner takes the
            # last address (the one Apache appended) for per-IP limits.
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 90s;
        }

        location = /health {
            set $runner http://cs-runner:8080;
            proxy_pass $runner;
        }

        location / {
            return 404;
        }
    }
}
